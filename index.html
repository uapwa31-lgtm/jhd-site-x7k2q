#ld{position:fixed;inset:0;display:none;background:#0b191c;place-items:center}
#ld img{width:180px;animation:p 1.3s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.15;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
#lg{position:fixed;inset:0;display:flex;align-items:center;justify-content:space-between;flex-direction:row;padding:0 min(9vw,130px);gap:40px}
#card{width:360px;max-width:100%;background:#0f242bf2;border:1px solid #2b5666;border-radius:18px;padding:28px 30px 24px;box-shadow:0 20px 60px #0008}
#card img{display:block;width:110px;margin:0 auto 12px}
#card h1{margin:0 0 14px;text-align:center;font-size:26px}
label{display:block;font-size:13px;margin:12px 0 6px;color:#cfe0e4}
input[type=text],input[type=password]{width:100%;height:46px;border:1px solid #2b5666;border-radius:8px;background:#0b191c;color:#fff;padding:0 14px;font:inherit;font-size:14px;direction:rtl;outline:0}
input[type=text]:focus,input[type=password]:focus{border-color:#3CC9B5;box-shadow:0 0 0 3px #3cc9b533}
.rm{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:#cfe0e4;cursor:pointer}
.rm input{accent-color:#3CC9B5;width:16px;height:16px;margin:0}
#err{min-height:20px;margin-top:12px;font-size:13px;color:#ff8f8f;text-align:center}
button{width:100%;height:46px;border:0;border-radius:8px;background:#1f8a63;color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
button:hover{background:#25a074}button:disabled{opacity:.6;cursor:wait}
#ft{margin-top:14px;text-align:center;font-size:12px;color:#8ea6ac}
#wl{max-width:520px;text-align:right}
#wl h2{margin:0 0 20px;font-size:44px;line-height:1.25}
#wl p{margin:0;font-size:17px;line-height:1.9;opacity:.92}
#cp{position:fixed;bottom:26px;right:min(9vw,130px);font-size:11px;opacity:.55}
#mlogo{display:none}
@media(max-width:820px){
